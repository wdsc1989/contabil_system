# Configuração Nginx para Sistema Contábil
# Copie este arquivo para /etc/nginx/sites-available/contabil
# e crie um link simbólico: ln -s /etc/nginx/sites-available/contabil /etc/nginx/sites-enabled/
# Depois execute: nginx -t && systemctl reload nginx

# Configuração HTTP (sem SSL - use esta até configurar SSL)
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Substitua pelo seu domínio

    # Para Let's Encrypt (necessário para gerar certificados)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Headers de segurança básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Tamanho máximo de upload (aumentado para imagens grandes)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Timeouts (aumentados para processamento de imagens com Vision API)
    proxy_connect_timeout 900s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    send_timeout 900s;
    keepalive_timeout 900s;
    
    # Timeout para uploads grandes
    client_body_timeout 900s;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Logs
    access_log /var/log/nginx/contabil_access.log;
    error_log /var/log/nginx/contabil_error.log;

    # Proxy para Streamlit
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        
        # Headers necessários para WebSocket (Streamlit usa)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Buffering (desabilitado para uploads grandes)
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Timeouts específicos para esta location
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        
        # Não interromper conexões longas
        proxy_ignore_client_abort on;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

